<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scope</title><style>
body{font:15px sans-serif;background:#111;color:#ddd;margin:12px}
button{font-size:15px;padding:8px;margin:2px;background:#1976d2;color:#fff;border:0}
#out{font:12px monospace;white-space:pre-wrap}
</style></head><body>
<div>Nomi globali letti dentro closure, dove il motore ricorda la risoluzione: ogni riga deve dire OK.</div>
<button id="go">Avvia</button><button id="send">Invia</button><div id="out"></div>
<script src="common.js"></script><script>
(function () {
  var lines = [], out = T.$("out");
  function say(s) { lines.push(s); out.textContent = lines.join("\n"); }
  function check(name, got, want) { say((got === want ? "OK " : "ERRORE ") + name + (got === want ? "" : ": " + got + " invece di " + want)); }
  function hot(f) { var r; for (var i = 0; i < 3000; i++) r = f(); return r; }

  function run() {
    lines = [];
    var reader = (function () { var a = 1; return function () { var b = a; return (function () { return b && status; })(); }; })();
    window.status = "dalla finestra";
    check("attributo della finestra", hot(reader), "dalla finestra");
    var s = document.createElement("script");
    s.textContent = "let status = 'let globale';";
    document.head.appendChild(s);
    check("let globale arrivato dopo", hot(reader), "let globale");

    var missing = (function () { var a = 1; return function () { return a && typeof nomeCheNonEsiste; }; })();
    check("nome assente", hot(missing), "undefined");
    window.nomeCheNonEsiste = 1;
    check("nome aggiunto dopo", hot(missing), "number");

    function withEval(code) {
      var a = 1;
      function inner() { return a && typeof location; }
      var first = hot(inner);
      eval(code);
      return [first, hot(inner)].join();
    }
    check("var iniettata da eval", withEval("var location = 5;"), "object,number");
    check("stessa funzione senza eval", withEval(""), "object,object");
    check("di nuovo con eval", withEval("var location = 6;"), "object,number");
    check("di nuovo senza", withEval(""), "object,object");

    function deep(code) {
      var a = 1;
      eval(code);
      return function () { var b = a; return function () { var c = b; return function () { return c && typeof location; }; }; };
    }
    var plain = deep("")()(), injected = deep("var location = 5;")()();
    check("tre scope, senza var", hot(plain), "object");
    check("tre scope, var iniettata", hot(injected), "number");
    check("tre scope, ancora senza", hot(plain), "object");

    function closureVar() {
      var z = "variabile esterna";
      eval("");
      return function () { var b = 1; return function () { return b && z; }; };
    }
    check("variabile sopra un eval", hot(closureVar()()), "variabile esterna");
    function shadowed() {
      var z = "esterna";
      var inner = function () { eval("var z = 'iniettata';"); return function () { var b = 1; return b && z; }; };
      return [hot(inner()), z].join();
    }
    check("var iniettata piu' vicina", shadowed(), "iniettata,esterna");

    var scoped = { location: "dal with" };
    var inWith;
    with (scoped) { inWith = function () { var b = 1; return (function () { return b && location; })(); }; }
    check("dentro with", hot(inWith), "dal with");
    delete scoped.location;
    check("with senza piu' il nome", typeof hot(inWith), "object");

    var shadow = (function () { var location = "locale"; return function () { var b = 1; return (function () { return b && location; })(); }; })();
    check("variabile locale", hot(shadow), "locale");

    var frame = document.createElement("iframe");
    document.body.appendChild(frame);
    var w = frame.contentWindow;
    var source = "(function () { var a = 1; return function () { var b = a; return (function () { return b && document; })(); }; })()";
    var here = eval(source), there = w.eval(source);
    check("documento di qui", hot(here), document);
    check("documento dell'iframe", hot(there), w.document);
    check("di nuovo di qui", hot(here), document);
    document.body.removeChild(frame);
    if (window.gc) gc();
    check("dopo l'iframe", hot(here), document);

    var fine = lines.filter(function (l) { return l.indexOf("ERRORE") == 0; }).length;
    say(fine ? fine + " errori" : "tutto ok");
  }
  T.$("go").onclick = run;
  T.$("send").onclick = function () { T.send("scope", lines, function (ok) { T.$("send").textContent = ok ? "Inviato" : "Errore"; }); };
})();
</script></body></html>
