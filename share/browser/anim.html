<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animazione su pagina lunga</title><style>
body{font:16px sans-serif;background:#111;color:#ddd;margin:12px}
#bar{position:sticky;top:0;background:#000;padding:6px 0;z-index:2}
button{font-size:15px;padding:8px;margin:2px;background:#1976d2;color:#fff;border:0}
#box{width:60px;height:24px;margin:8px 0;background:#c33}
#box.on{animation:pulse 1s infinite alternate}
@keyframes pulse{from{background:#c33;width:60px}to{background:#3c3;width:120px}}
#dot{position:relative;width:16px;height:16px;background:#fc0;left:0}
p a{color:#9cf}
#stat{font:12px monospace;color:#9c9}
</style></head><body>
<div id="bar">
<div>Il caso di poste.it: pagina lunga e ferma, un solo elemento piccolo che si anima. Guarda nel log "render" ogni 2 s.</div>
<button id="css">Animazione CSS (colore e larghezza)</button><button id="raf">Animazione JS (rAF, left)</button><button id="stop">Ferma</button><button id="send">Invia</button>
<div id="box"></div><div id="dot"></div>
<div id="stat">ferma</div>
</div>
<div id="long"></div>
<script src="common.js"></script><script>
(function () {
  // A long page full of links and buttons: interaction regions and event-region painting have something to walk.
  var html = [];
  for (var i = 0; i < 300; i++)
    html.push("<p>Paragrafo " + i + ": testo di riempimento con <a href='#p" + i + "'>un link</a>, <button>pulsante " + i +
      "</button> e altro testo per fare righe, come una pagina di notizie o di un ufficio postale qualunque.</p>");
  T.$("long").innerHTML = html.join("");

  var mode = "ferma", frames = 0, start = 0, rafId = 0, x = 0, log = [];
  function report() {
    if (mode === "ferma") return;
    var s = (T.now() - start) / 1000;
    T.$("stat").textContent = mode + ": " + frames + " fotogrammi in " + s.toFixed(1) + " s = " + (frames / s).toFixed(1) + " fps";
  }
  function tick() {
    frames++;
    if (mode === "raf") { x = (x + 3) % 200; T.$("dot").style.left = x + "px"; }
    rafId = requestAnimationFrame(tick);
  }
  function begin(m) {
    stop();
    mode = m; frames = 0; start = T.now();
    if (m === "css") T.$("box").className = "on";
    rafId = requestAnimationFrame(tick);
  }
  function stop() {
    if (mode !== "ferma") { report(); log.push(T.$("stat").textContent); }
    cancelAnimationFrame(rafId);
    T.$("box").className = "";
    mode = "ferma";
  }
  setInterval(report, 1000);
  T.$("css").onclick = function () { begin("css"); };
  T.$("raf").onclick = function () { begin("raf"); };
  T.$("stop").onclick = stop;
  T.$("send").onclick = function () { stop(); T.send("anim", log, function (ok) { T.$("send").textContent = ok ? "Inviato" : "Errore"; }); };
})();
</script></body></html>
