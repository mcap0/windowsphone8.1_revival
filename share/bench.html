<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>bench</title><style>body{font:18px sans-serif;background:#000;color:#fff;margin:16px}</style></head>
<body><h2>Benchmark JS</h2><div id="out">in corso...</div><script>
function t(name,f){var a=performance.now();var r=f();var ms=Math.round(performance.now()-a);return name+": "+ms+" ms ("+r+")";}
setTimeout(function(){
var lines=[navigator.userAgent];
lines.push(t("loop 5M",function(){var s=0;for(var i=0;i<5000000;i++){s=(s+i*3)|0;}return s;}));
lines.push(t("oggetti 300k",function(){var a=[];for(var i=0;i<300000;i++){a.push({x:i,y:i*2});}var s=0;for(var j=0;j<a.length;j++)s+=a[j].y;return s;}));
lines.push(t("stringhe 100k",function(){var s="";for(var i=0;i<100000;i++){s+=String.fromCharCode(97+i%26);}return s.length;}));
lines.push(t("regexp 20k",function(){var re=/([a-z]+)@([a-z]+)\.com/;var n=0;for(var i=0;i<20000;i++){if(re.test("user"+i+"abc@example.com"))n++;}return n;}));
lines.push(t("funzioni 2M",function(){function f(x){return x+1;}var s=0;for(var i=0;i<2000000;i++)s=f(s);return s;}));
document.getElementById("out").innerHTML=lines.join("<br>");
var x=new XMLHttpRequest();x.open("POST","/bench");x.send(lines.join("\n"));
},300);
</script></body></html>
